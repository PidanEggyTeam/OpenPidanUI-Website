# Tailwind 的包族在 Windows 默认 isolated 布局下会出现「只链一半」，改扁平布局规避。
nodeLinker: hoisted

# pnpm 12 用 allowBuilds 放行依赖的 postinstall，否则 esbuild / workerd 二进制装不全，
# nuxi generate 与 wrangler 都会在运行期报"找不到可执行文件"。
allowBuilds:
  esbuild: true
  workerd: true
  vue-demi: true
  # @nuxt/content 的构建期数据库
  better-sqlite3: true
  sharp: true
